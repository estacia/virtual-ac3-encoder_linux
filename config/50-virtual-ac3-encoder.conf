# Virtual AC-3 Encoder: create a 5.1 virtual sink and route its encoded bitstream
# to the default output. Set target.object to an exact HDMI/IEC958 node name when
# the default output is not the intended receiver.

context.modules = [
  {
    name = libpipewire-module-virtual-ac3-encoder
    args = {
      # Example: target.object = "alsa_output.pci-0000_00_1f.3.hdmi-stereo"
      bitrate = 640000
      latency = extreme
      quantum = 128
      upmix = dynamic-time-domain
    }
  }
]
