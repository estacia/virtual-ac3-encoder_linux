name: Linux CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y meson ninja-build pkg-config g++ libpipewire-0.3-dev libavcodec-dev libavutil-dev
      - name: Configure
        run: meson setup build --buildtype=release
      - name: Build
        run: meson compile -C build
      - name: Test
        run: meson test -C build --print-errorlogs
